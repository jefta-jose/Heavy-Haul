# Publishes site/ (the privacy policy Google Play requires) to GitHub Pages:
#   https://jefta-jose.github.io/Heavy-Haul/privacy-policy.html
# One-time: repo Settings > Pages > Source: "GitHub Actions". Runs when site/ changes on main, or by hand.
name: Site
on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # upload and deploy are separate jobs: deploying in the same job, half a second after the upload, found no artifact yet
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
