name: Google Play release

# Store deployment is always explicit. Normal pushes keep using android.yml's debug APK.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique integer higher than every version code already uploaded to Play'
        required: true
        type: string
      version_name:
        description: 'Player-facing release version, e.g. 0.10.0'
        required: true
        type: string
        default: '0.10.0'
      track:
        description: 'Google Play destination'
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Use draft if Play Console setup/review must be completed manually'
        required: true
        type: choice
        default: completed
        options:
          - completed
          - draft

permissions:
  contents: read

# Finish each store transaction before the next manual release starts.
concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Read the real checked-out config, before installing/building or reading signing secrets.
      # No build override may mask forgotten testing values.
      - name: Require production starting economy
        run: npm run check:release

      # Free test purchases must never reach real players: the production track needs SHOP_TEST_PURCHASES = false and a
      # purchase verifier (PLAY_VERIFY_URL). Internal, alpha and beta tracks may keep test purchases for testers.
      - name: Require real payments on the production track
        if: ${{ inputs.track == 'production' }}
        run: |
          node --input-type=module <<'JS'
          const cfg = await import(new URL('src/game-config.js', `file://${process.cwd()}/`));
          if (cfg.SHOP_TEST_PURCHASES) throw new Error('SHOP_TEST_PURCHASES is true: purchases would be free in production.');
          if (!cfg.PLAY_VERIFY_URL) throw new Error('PLAY_VERIFY_URL is empty: deploy functions/verify-purchase first (deployment-step-by-step.md, Part 6).');
          if (!cfg.PLAY_REFUNDS_URL) throw new Error('PLAY_REFUNDS_URL is empty: deploy the voided entry point of functions/verify-purchase first (deployment-step-by-step.md, Part 6).');
          JS

      - name: Validate release inputs and secrets
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'JS'
          const env = process.env;
          if (!/^[1-9]\d*$/.test(env.VERSION_CODE) || Number(env.VERSION_CODE) > 2100000000) {
            throw new Error('version_code must be an integer from 1 to 2100000000.');
          }
          if (!env.VERSION_NAME.trim()) throw new Error('version_name must not be blank.');
          for (const key of ['ANDROID_RELEASE_KEYSTORE_BASE64', 'ANDROID_RELEASE_STORE_PASSWORD', 'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD', 'PLAY_SERVICE_ACCOUNT_JSON']) {
            if (!env[key]) throw new Error(`Missing release secret: ${key}`);
          }
          let account;
          try { account = JSON.parse(env.PLAY_SERVICE_ACCOUNT_JSON); } catch { throw new Error('PLAY_SERVICE_ACCOUNT_JSON must contain valid JSON.'); }
          if (!account?.client_email || !account?.private_key) throw new Error('PLAY_SERVICE_ACCOUNT_JSON must contain a service-account email and private key.');
          JS

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: npm ci
      - name: Test the release gate
        run: node --test tests/release-economy.test.js
      - run: npm run android:sync

      # The game is ~275 MB and a Play bundle's base module may not exceed 200 MB: the truck and map art moves into the
      # install-time asset pack android/gamedata (Play Asset Delivery), installed by Google Play together with the app.
      - name: Move the heavy art into the Play asset pack
        run: node tools/android-asset-pack.mjs

      - name: Decode upload keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/heavy-haul-upload.jks"
          test -s "$RUNNER_TEMP/heavy-haul-upload.jks"

      - name: Build signed release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          # include android/gamedata (the asset pack) in the bundle
          HAUL_ASSET_PACK: '1'
          # Google Play Games sign-in: the game's project id (Play Console > Play Games Services > Configuration);
          # without it the game runs, players just stay guests
          PLAY_GAMES_APP_ID: ${{ vars.PLAY_GAMES_APP_ID }}
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/heavy-haul-upload.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      # Google Play rejects a base module over 200 MB: fail here, with the sizes, rather than at upload
      - name: Check the bundle's module sizes
        run: |
          unzip -l android/app/build/outputs/bundle/release/app-release.aab | awk '{ split($4, p, "/"); s[p[1]] += $1 } END { for (m in s) printf "%-12s %7.1f MB\n", m, s[m] / 1e6; if (s["base"] > 195e6) { print "base module over the 200 MB limit"; exit 1 } }'

      - name: Save signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: heavy-haul-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.heavyhaul.game
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ inputs.version_name }}
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/heavy-haul-upload.jks"
