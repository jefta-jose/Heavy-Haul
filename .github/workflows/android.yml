# Builds the Android app on every push to main and publishes the APK as the "latest-build" release,
# so a phone can always install the newest test build from
#   https://github.com/jefta-jose/Heavy-Haul/releases/download/latest-build/heavy-haul.apk
# Set the ANDROID_DEBUG_KEYSTORE secret (base64 of a debug keystore, see README) so every build
# has the same signature and installs over the previous one.
name: Android test build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run build:app

      - name: Shared debug key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > android/app/heavy-haul-debug.keystore
          else echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: uninstall the previous build before installing this one"; fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: build-${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk heavy-haul.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build heavy-haul.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest test build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s). On the phone, tap heavy-haul.apk below to download and install."
