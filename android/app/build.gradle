apply plugin: 'com.android.application'

android {
    namespace = "com.heavyhaul.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.heavyhaul.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets these per build (the run number), so each new APK installs over the last one
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("VERSION_NAME") ?: "dev")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A fixed debug key, so every test build has the same signature and installs over the last one.
    // It is not in the repo: CI writes it from the ANDROID_DEBUG_KEYSTORE secret (see
    // .github/workflows/android.yml). Without it Android Gradle's own per-machine debug key is used.
    def sharedDebugKey = file('heavy-haul-debug.keystore')
    def uploadKeyPath = System.getenv('ANDROID_RELEASE_KEYSTORE')
    def uploadStorePassword = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
    def uploadKeyAlias = System.getenv('ANDROID_RELEASE_KEY_ALIAS')
    def uploadKeyPassword = System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
    def uploadSigningReady = [uploadKeyPath, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }
    // Never emit an unsigned store bundle when the upload key is missing.
    gradle.taskGraph.whenReady { graph ->
        if ((graph.hasTask(':app:bundleRelease') || graph.hasTask(':app:assembleRelease')) && !uploadSigningReady) {
            throw new GradleException('Release signing requires ANDROID_RELEASE_KEYSTORE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD.')
        }
    }
    signingConfigs {
        if (uploadSigningReady) {
            googlePlay {
                storeFile file(uploadKeyPath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
        if (sharedDebugKey.exists()) {
            sharedDebug {
                storeFile sharedDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            if (sharedDebugKey.exists()) signingConfig signingConfigs.sharedDebug
        }
        release {
            if (uploadSigningReady) signingConfig signingConfigs.googlePlay
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
